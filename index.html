<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Science Scholars Program Mentor Atlas</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="styles.css"><script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script defer src="profile.js"></script><script defer src="search.js"></script><script defer src="app.js"></script></head>
<body>
<section id="gate"><div class="gate-card"><h1>Social Science Scholars Program<br>Mentor Atlas</h1><form id="unlock"><label for="password" class="sr-only">Password</label><div class="password-row"><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button>Enter atlas ↗</button></div><p id="gate-error" role="status"></p></form></div><div class="gate-art"><img src="assets/sparty.webp" alt="Sparty holding a Michigan State flag at Spartan Stadium"></div></section>
<div id="app" hidden><header><a href="./" class="brand"><img class="brand-logo" src="assets/helmet_logo.jpg" alt="MSU Spartan helmet"><span>Social Science Scholars Program<small>Mentor Atlas</small></span></a><div><button id="lock" class="quiet">Lock atlas</button></div></header>
<main><section class="intro"><div><p>Explore the alumni community. Find a perspective or a person to learn from.</p></div><div class="stats"><strong>100<span>potential connections</span></strong><strong>6<span>countries represented</span></strong></div></section>
<section class="explorer" aria-label="Mentor explorer"><div class="toolbar"><label class="search"><span class="sr-only">Search mentors</span><input id="search" type="search" placeholder="Search names, careers, degrees…"></label><label><span class="sr-only">Specialization</span><select id="specialization"><option value="">All specializations</option></select></label><label><span class="sr-only">Region</span><select id="region"><option value="">Everywhere</option><option value="us">United States</option><option value="world">Outside the US</option></select></label><button id="reset" class="quiet">Reset</button></div>
<div class="workspace"><aside><div class="list-heading"><h2>Meet your community</h2><span id="count" aria-live="polite"></span></div><button id="clear-city" hidden class="city-filter"></button><div id="results"></div></aside><section class="map-panel" aria-label="Mentor map"><div id="map"></div><div id="map-message" role="status"></div></section></div></section>
<footer><span id="last-updated">Last Updated: 11/11/2026</span></footer></main></div>
<dialog id="profile"><button id="close-profile" class="quiet close" aria-label="Close mentor profile">✕</button><div id="profile-content"></div></dialog>
</body></html>
